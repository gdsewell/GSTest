<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121917" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Renewals">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;600&display=swap">
<title>Renewals</title>
<style>
:root{--bg:#eef2f1;--ink:#1d2b2a;--mute:#5b6b69;--pine:#1f5c4f;--soon:#b7791f;--late:#b3261e;--line:#cfd9d6;--card:#fff;--field:#fff;--pop:#fff;--onpine:#fff;--b1:#e3efec;--b2:#f8ecd3;--b2t:#8a5a0f;--b3:#f6dad7}
@media(prefers-color-scheme:dark){:root{--bg:#121917;--ink:#e6efed;--mute:#9bb0ac;--pine:#4fb39c;--soon:#e0a84a;--late:#ff8a80;--line:#2c3a37;--card:#1b2523;--field:#141c1a;--pop:#222d2a;--onpine:#08201a;--b1:#1f3a34;--b2:#3d3115;--b2t:#f0c46d;--b3:#4a2422}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,.badge b,.sum b{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:1.6rem;margin:0}h2{font-size:1rem;margin:28px 0 8px;color:var(--mute);font-weight:600}
small{display:block;color:var(--mute)}
.card{background:var(--card);padding:24px;border-radius:10px;max-width:420px;margin:40px auto}
input,select,textarea{width:100%;padding:10px;margin:4px 0 12px;border:1px solid var(--line);border-radius:6px;font:inherit;min-height:44px;background:var(--field);color:var(--ink)}
label{display:block;font-size:.9rem;color:var(--mute)}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
button{padding:9px 14px;border:0;border-radius:6px;background:var(--pine);color:var(--onpine);font:inherit;min-height:44px;cursor:pointer}
button.ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
button.danger{background:#b3261e;color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--soon);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>label{flex:1}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.sum div{background:var(--card);padding:12px;border-radius:8px;font-size:.85rem;color:var(--mute)}
.sum b{display:block;font-size:1.5rem;color:var(--ink);font-variant-numeric:tabular-nums}
.sum .bad b{color:var(--late)}.sum .warn b{color:var(--soon)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{min-height:40px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.chip.on{background:var(--pine);color:var(--onpine);border-color:var(--pine)}
.item{display:flex;align-items:center;gap:14px;background:var(--card);padding:12px 14px;margin-bottom:8px;border-radius:10px}
.badge{min-width:68px;text-align:center;padding:6px 4px;border-radius:8px;background:var(--b1);color:var(--pine);line-height:1.1}
.badge b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}.badge small{color:inherit;font-size:.75rem}
.soon .badge{background:var(--b2);color:var(--b2t)}.late .badge{background:var(--b3);color:var(--late)}
.mid{flex:1;min-width:0}.mid>b{display:block}
.act{display:flex;gap:6px;align-items:center}.act button{padding:6px 14px;font-size:.9rem;min-height:40px}
.more{position:relative}.more summary{list-style:none;cursor:pointer;padding:6px 12px;font-size:1.4rem;border-radius:6px}
.more summary::-webkit-details-marker{display:none}
.more[open] .pop{position:absolute;right:0;top:100%;z-index:2;background:var(--pop);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:130px;box-shadow:0 4px 12px #0002}
.pop button{background:transparent;color:var(--ink);text-align:left}
.msg{color:var(--late)}
.day{display:grid;gap:6px;padding:12px;background:var(--card);border-radius:10px;margin-bottom:8px}.day.today{outline:2px solid var(--pine)}.day input,.day select{margin:0}
@media(min-width:560px){.day{grid-template-columns:150px 1fr 1fr;align-items:center}}
.shop{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border-radius:10px;margin-bottom:6px;min-height:48px;color:var(--ink);font-size:1rem}
.shop input{width:22px;height:22px;min-height:0;margin:0}.shop.done span{text-decoration:line-through;color:var(--mute)}
.hrow{padding:10px 0;border-bottom:1px solid var(--line)}.hrow .top{display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px}.bar i{display:block;height:100%;border-radius:4px;background:var(--pine)}
.chg.up{color:var(--late)}.chg.down{color:var(--pine)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:2rem;line-height:1;padding:0;box-shadow:0 4px 14px #0005;z-index:5}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;box-shadow:0 4px 14px #0004;max-width:90vw}
dialog{background:var(--card);color:var(--ink);border:0;border-radius:10px;padding:20px;width:min(440px,94vw)}
dialog::backdrop{background:#0006}
@media(max-width:560px){.item{flex-wrap:wrap}.mid{flex-basis:calc(100% - 90px)}.act{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1. Paste your values from Supabase: Project Settings > API
const SUPABASE_URL = "https://uosvxizpldrihzpdkesw.supabase.co";
const SUPABASE_KEY = "sb_publishable_L0fo1cCNrU2j6o2zulyG6Q_W8okfjof";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), app = $('#app'), dlg = $('#dlg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = n => new Intl.NumberFormat('en-GB', {style:'currency', currency:'GBP'}).format(n || 0);
const days = d => Math.round((new Date(d) - new Date(new Date().toDateString())) / 864e5);
const monthly = r => r.cost_frequency === 'monthly' ? +r.cost : +r.cost / 12;
const fmt = d => new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
let S = {user:null, hh:null, members:[], assets:[], rows:[]};
const who = id => S.members.find(m => m.user_id === id)?.name;

db.auth.onAuthStateChange((_, s) => { S.user = s?.user || null; setTimeout(boot, 0); });

async function boot() {
  if (!S.user) { if (S.ch) { db.removeChannel(S.ch); S.ch = null; } return authView(); }
  const {data} = await db.from('members').select('household_id,name,households(name,invite_code)').eq('user_id', S.user.id).limit(1);
  if (!data?.length) return setupView();
  S.hh = {id: data[0].household_id, ...data[0].households};
  load();
}

function authView() {
  app.innerHTML = `<section class=card><h1>Renewals</h1><p>Sign in to see what is due.</p>
  <input id=em type=email placeholder=Email autocomplete=email><input id=pw type=password placeholder=Password autocomplete=current-password>
  <div class=row><button id=in>Sign in</button><button id=up class=ghost>Create account</button></div><p id=msg class=msg></p></section>`;
  const go = fn => async () => {
    const {error} = await fn({email:$('#em').value, password:$('#pw').value});
    $('#msg').textContent = error ? error.message : 'If asked, confirm your email, then sign in.';
  };
  $('#in').onclick = go(v => db.auth.signInWithPassword(v));
  $('#up').onclick = go(v => db.auth.signUp(v));
}

function setupView() {
  app.innerHTML = `<section class=card><h1>Set up your household</h1>
  <label>Your name<input id=nm></label>
  <h2>Start a new household</h2><input id=hn placeholder="Our house"><button id=mk>Create household</button>
  <h2>Or join your partner's</h2><input id=cd placeholder="Invite code"><button id=jn class=ghost>Join household</button><p id=msg class=msg></p></section>`;
  const run = async (fn, args) => { const {error} = await db.rpc(fn, args); error ? $('#msg').textContent = error.message : boot(); };
  $('#mk').onclick = () => run('create_household', {hname:$('#hn').value, uname:$('#nm').value});
  $('#jn').onclick = () => run('join_household', {code:$('#cd').value.trim(), uname:$('#nm').value});
}

async function load() {
  if (!S.loaded) app.innerHTML = '<section class=card><p>Loading…</p></section>';
  S.loaded = true;
  const h = S.hh.id;
  const [m, a, r, hi] = await Promise.all([
    db.from('members').select('user_id,name').eq('household_id', h),
    db.from('assets').select('*').eq('household_id', h).order('name'),
    db.from('renewals').select('*').eq('household_id', h).order('due_date'),
    db.from('renewal_history').select('renewal_id,period_end,cost,provider').eq('household_id', h).order('period_end')]);
  S.members = m.data || []; S.assets = a.data || []; S.rows = r.data || []; S.hist = {}; S.prev = {}; (hi.data || []).forEach(x => { (S.hist[x.renewal_id] ||= []).push(x); S.prev[x.renewal_id] = +x.cost; });
  await loadMeals(); sub(); show();
}

const mon = () => { const t = new Date(); t.setHours(12, 0, 0, 0); t.setDate(t.getDate() - (t.getDay() + 6) % 7 + 7 * (S.wk || 0)); return t; };
const wdays = () => { const m = mon(); return [...Array(7)].map((_, i) => { const d = new Date(m); d.setDate(m.getDate() + i); return d; }); };
const iso = d => d.toISOString().slice(0, 10);
const nav = () => { const o = (S.items || []).filter(i => !i.done).length; return `<nav class=chips style="margin-top:14px">${[['renewals', 'Renewals'], ['meals', 'Meals'], ['shop', 'Shopping' + (o ? ' (' + o + ')' : '')]].map(([k, l]) => `<button class="chip ${(S.tab || 'renewals') === k ? 'on' : ''}" data-a=tab data-id=${k}>${l}</button>`).join('')}</nav>`; };
const show = () => ({meals: mealsView, shop: shopView}[S.tab] || dash)();

async function loadMeals() {
  const h = S.hh.id, w = wdays();
  const [rc, mp, sh] = await Promise.all([
    db.from('recipes').select('*').eq('household_id', h).order('title'),
    db.from('meal_plan').select('*').eq('household_id', h).gte('day', iso(w[0])).lte('day', iso(w[6])),
    db.from('shopping_items').select('*').eq('household_id', h).order('created_at')]);
  S.mealErr = rc.error; S.recipes = rc.data || []; S.plan = {}; (mp.data || []).forEach(x => S.plan[x.day] = x); S.items = sh.data || [];
}

function sub() {
  if (S.ch) return;
  const cb = async () => { await loadMeals(); if (!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) show(); };
  S.ch = db.channel('hh');
  for (const table of ['shopping_items', 'meal_plan']) S.ch.on('postgres_changes', {event:'*', schema:'public', table, filter:`household_id=eq.${S.hh.id}`}, cb);
  S.ch.subscribe();
}

const head = () => `<header><div><h1>${esc(S.hh.name)}</h1></div><button class=ghost data-a=out>Sign out</button></header>${nav()}`;

function mealsView() {
  if (S.mealErr) return app.innerHTML = head() + '<section class=card style="max-width:none"><p>Meals and shopping need one more database step. Run <b>supabase/meals.sql</b> in the Supabase SQL Editor, then refresh.</p></section>';
  const w = wdays(), today = iso(new Date(new Date().setHours(12))), opts = sel => '<option value="">No recipe</option>' + S.recipes.map(r => `<option value=${r.id} ${sel === r.id ? 'selected' : ''}>${esc(r.title)}</option>`).join('');
  const rows = w.map(d => { const k = iso(d), p = S.plan[k] || {}; return `<div class="day ${k === today ? 'today' : ''}" data-day=${k}><b>${d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'})}</b>
  <select aria-label="Dinner for ${k}">${opts(p.recipe_id)}</select><input placeholder="or type a meal" value="${esc(p.note)}" aria-label="Note for ${k}"></div>`; }).join('');
  app.innerHTML = head() + `<div class=row style="margin:16px 0;align-items:center"><button class=ghost data-a=wk data-id=-1 aria-label="Previous week">‹</button><b>Week of ${fmt(iso(w[0]))}</b><button class=ghost data-a=wk data-id=1 aria-label="Next week">›</button></div>
  ${rows}<div class=row style="margin-top:16px"><button data-a=plan2shop>Add this week's ingredients to shopping list</button></div>
  <h2>Recipes</h2>${S.recipes.map(r => `<div class=hrow><div class=top><b>${esc(r.title)}</b><button class=ghost data-a=redit data-id=${r.id}>Edit</button></div></div>`).join('') || '<small>No recipes yet. Tap + to add your first.</small>'}
  <button class=fab data-a=radd aria-label="Add recipe">+</button>`;
}

function shopView() {
  if (S.mealErr) return mealsView();
  const open = S.items.filter(i => !i.done), done = S.items.filter(i => i.done);
  const line = i => `<label class="shop ${i.done ? 'done' : ''}"><input type=checkbox data-a=tick data-id=${i.id} ${i.done ? 'checked' : ''}><span>${esc(i.name)}</span></label>`;
  app.innerHTML = head() + `<form id=qf class=row style="margin:16px 0"><input id=qa placeholder="Add an item, e.g. milk" autocomplete=off style="flex:1;margin:0"><button>Add</button></form>
  ${open.map(line).join('') || '<small>Nothing to buy.</small>'}
  ${done.length ? `<h2>In the trolley</h2>${done.map(line).join('')}<button class=ghost data-a=clear style="margin-top:12px">Clear ticked items</button>` : ''}`;
  $('#qf').onsubmit = async e => { e.preventDefault(); const v = $('#qa').value.trim(); if (!v) return; $('#qa').value = ''; await addItems([v]); };
}

async function addItems(names) {
  const have = new Set(S.items.filter(i => !i.done).map(i => i.name.toLowerCase()));
  const fresh = [...new Map(names.map(n => n.trim()).filter(n => n && !have.has(n.toLowerCase())).map(n => [n.toLowerCase(), n])).values()];
  if (!fresh.length) return toast('Already on the list');
  const {error} = await db.from('shopping_items').insert(fresh.map(name => ({household_id:S.hh.id, name, added_by:S.user.id})));
  if (error) return toast(error.message);
  await loadMeals(); show(); toast(fresh.length === 1 ? 'Added' : `Added ${fresh.length} items`);
}

function recipeForm(r = {}) {
  dlg.innerHTML = `<form id=f><h2>${r.id ? 'Edit' : 'Add'} recipe</h2>
  <div class=row style="margin-bottom:12px"><input id=ru type=url placeholder="Import from a link: https://…" aria-label="Recipe link" style="flex:1;margin:0"><button type=button class=ghost id=ri>Import</button></div>
  <label>Name<input name=title required value="${esc(r.title)}" placeholder="Chicken curry"></label>
  <label>Ingredients, one per line<textarea name=ingredients rows=8 placeholder="500g chicken&#10;2 onions&#10;1 tin coconut milk">${esc(r.ingredients)}</textarea></label>
  <label>Notes or link<textarea name=notes rows=3>${esc(r.notes)}</textarea></label>
  <div class=row><button>Save</button><button type=button class=ghost id=cx>Cancel</button>${r.id ? '<button type=button class=danger id=del>Delete</button>' : ''}</div></form>`;
  dlg.showModal(); $('#cx').onclick = () => dlg.close();
  $('#ri').onclick = async () => {
    const url = $('#ru').value.trim(); if (!url) return toast('Paste a recipe link first');
    const b = $('#ri'); b.disabled = true; b.textContent = 'Importing…';
    const {data, error} = await db.functions.invoke('import-recipe', {body:{url}});
    b.disabled = false; b.textContent = 'Import';
    if (error || data?.error) return toast(data?.error || 'Import is not set up yet. See the README.');
    const el = $('#f').elements; el.title.value = data.title; el.ingredients.value = data.ingredients; el.notes.value = data.notes;
    toast('Imported. Check it over, then save.');
  };
  if (r.id) $('#del').onclick = async () => { if (confirm('Delete this recipe?')) { await db.from('recipes').delete().eq('id', r.id); dlg.close(); await loadMeals(); show(); toast('Deleted'); } };
  $('#f').onsubmit = async e => {
    e.preventDefault(); const sb = e.submitter; sb.disabled = true; sb.textContent = 'Saving…';
    const f = Object.fromEntries(new FormData(e.target)), row = {household_id:S.hh.id, title:f.title, ingredients:f.ingredients, notes:f.notes};
    const {error} = await (r.id ? db.from('recipes').update(row).eq('id', r.id) : db.from('recipes').insert(row));
    if (error) { sb.disabled = false; sb.textContent = 'Save'; return toast(error.message); }
    dlg.close(); await loadMeals(); show(); toast('Saved');
  };
}

app.onchange = async e => {
  const t = e.target;
  if (t.dataset.a === 'tick') { const it = S.items.find(i => i.id === t.dataset.id); it.done = t.checked; show(); await db.from('shopping_items').update({done:t.checked}).eq('id', it.id); return; }
  const row = t.closest('.day'); if (!row) return;
  const p = {household_id:S.hh.id, day:row.dataset.day, recipe_id:row.querySelector('select').value || null, note:row.querySelector('input').value};
  S.plan[p.day] = p;
  const {error} = await db.from('meal_plan').upsert(p, {onConflict:'household_id,day'}); if (error) toast(error.message);
};

function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 3200); }
const chg = r => {
  const p = S.prev?.[r.id]; if (!p) return '';
  const d = +r.cost - p, sg = d > 0 ? '+' : '−';
  if (d === 0) return '<small class=chg>Same price as last year</small>';
  return `<small class="chg ${d > 0 ? 'up' : 'down'}">${sg}${gbp(Math.abs(d))} (${sg}${Math.round(Math.abs(d) / p * 100)}%) vs last year</small>`;
};
const ico = {insurance:'🛡️', utility:'💡', vehicle:'🚗', other:'📄'};
const card = r => {
  const d = days(r.due_date), a = S.assets.find(x => x.id === r.asset_id);
  const sub = [a?.name, r.provider, fmt(r.due_date)].filter(Boolean).join(', ');
  const big = d < 0 ? -d : d === 0 ? 'Today' : d, lab = d < 0 ? 'days late' : d === 0 ? '' : d === 1 ? 'day' : 'days';
  return `<article class="item ${d < 0 ? 'late' : d <= 30 ? 'soon' : ''}">
  <div class=badge><b>${big}</b><small>${lab}</small></div>
  <div class=mid><b>${ico[r.category] || ico.other} ${esc(r.title)}</b><small>${esc(sub)}</small>
  <small>${gbp(r.cost)} ${r.cost_frequency === 'monthly' ? 'a month' : 'a year'}${r.status === 'in_progress' ? ', ' + esc(who(r.owner_id) || 'Someone') + ' is on it' : ''}</small>${chg(r)}</div>
  <div class=act><button data-a=ren data-id=${r.id}>Renewed</button>
  <details class=more><summary aria-label="More actions">⋯</summary><div class=pop><button data-a=hist data-id=${r.id}>Price history</button><button data-a=on data-id=${r.id}>I'm on it</button><button data-a=ed data-id=${r.id}>Edit</button></div></details></div></article>`;
};

function dash() {
  const all = S.rows, rows = S.f ? all.filter(r => r.asset_id === S.f) : all;
  const left = [...rows], per = [['Overdue', r => days(r.due_date) < 0], ['Next 30 days', r => days(r.due_date) <= 30], ['Next 90 days', r => days(r.due_date) <= 90], ['Later', () => true]];
  let html = '';
  for (const [t, f] of per) { const g = left.filter(f); g.forEach(x => left.splice(left.indexOf(x), 1)); if (g.length) html += `<h2>${t}</h2>` + g.map(card).join(''); }
  const mo = all.reduce((s, r) => s + monthly(r), 0), late = all.filter(r => days(r.due_date) < 0).length;
  const soon = all.filter(r => { const d = days(r.due_date); return d >= 0 && d <= 30; }).length;
  const used = S.assets.filter(a => all.some(r => r.asset_id === a.id));
  const chips = used.length > 1 ? `<div class=chips><button class="chip ${S.f ? '' : 'on'}" data-a=f data-id="">All</button>${used.map(a => `<button class="chip ${S.f === a.id ? 'on' : ''}" data-a=f data-id="${a.id}">${esc(a.name)}</button>`).join('')}</div>` : '';
  app.innerHTML = `<header><div><h1>${esc(S.hh.name)}</h1><small>Partner invite code: <b>${esc(S.hh.invite_code)}</b></small></div>
  <div class=row><button class=ghost data-a=out>Sign out</button></div></header>
  ${nav()}<div class=sum><div class=bad><b>${late}</b>overdue</div><div class=warn><b>${soon}</b>due in 30 days</div><div><b>${gbp(mo)}</b>a month, ${gbp(mo * 12)} a year</div></div>
  <button class=fab data-a=add aria-label="Add renewal">+</button>${chips}${html || '<h2>Nothing here yet. Add a renewal, such as house insurance.</h2>'}`;
}

app.onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const r = S.rows.find(x => x.id === b.dataset.id), a = b.dataset.a;
  b.closest('details')?.removeAttribute('open');
  if (a === 'f') { S.f = b.dataset.id; dash(); }
  if (a === 'hist') history(r);
  if (a === 'tab') { S.tab = b.dataset.id; show(); }
  if (a === 'wk') { S.wk = (S.wk || 0) + +b.dataset.id; await loadMeals(); show(); }
  if (a === 'radd') recipeForm();
  if (a === 'redit') recipeForm(S.recipes.find(x => x.id === b.dataset.id));
  if (a === 'clear') { await db.from('shopping_items').delete().eq('household_id', S.hh.id).eq('done', true); await loadMeals(); show(); }
  if (a === 'plan2shop') {
    const lines = Object.values(S.plan).flatMap(p => (S.recipes.find(x => x.id === p.recipe_id)?.ingredients || '').split('\n')).filter(l => l.trim());
    lines.length ? addItems(lines) : toast('Pick some recipes for the week first');
  }
  if (a === 'add') form();
  if (a === 'ed') form(r);
  if (a === 'ren') renewed(r);
  if (a === 'out') db.auth.signOut();
  if (a === 'on') { await db.from('renewals').update({status:'in_progress', owner_id:S.user.id}).eq('id', r.id); load(); toast('Marked as yours'); }
};

function form(r = {}) {
  const a = S.assets.find(x => x.id === r.asset_id), v = k => esc(r[k]);
  dlg.innerHTML = `<form id=f><h2>${r.id ? 'Edit' : 'Add'} renewal</h2>
  <label>What<input name=title required value="${v('title')}" placeholder="Caravan insurance"></label>
  <label>Type<select name=category>${['insurance','utility','vehicle','other'].map(c => `<option ${r.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
  <label>For (pet, property, vehicle)<input name=asset list=al value="${esc(a?.name)}" placeholder="Biscuit, Home, Ford Focus"><datalist id=al>${S.assets.map(x => `<option value="${esc(x.name)}">`).join('')}</datalist></label>
  <label>Provider<input name=provider value="${v('provider')}"></label>
  <label>Policy or account number<input name=reference value="${v('reference')}"></label>
  <label>Due date<input type=date name=due_date required value="${v('due_date')}"></label>
  <div class=row><label>Cost<input type=number step=0.01 name=cost value="${v('cost')}"></label>
  <label>Paid<select name=cost_frequency><option value=annual>per year</option><option value=monthly ${r.cost_frequency === 'monthly' ? 'selected' : ''}>per month</option></select></label></div>
  <label>Notes<textarea name=notes rows=2>${v('notes')}</textarea></label>
  <label class=chk><input type=checkbox name=is_private ${r.is_private ? 'checked' : ''}> Only I can see this</label>
  <div class=row><button>Save</button><button type=button class=ghost id=cx>Cancel</button>${r.id ? '<button type=button class=danger id=del>Delete</button>' : ''}</div></form>`;
  dlg.showModal();
  $('#cx').onclick = () => dlg.close();
  if (r.id) $('#del').onclick = async () => { if (confirm('Delete this renewal and its history?')) { await db.from('renewals').delete().eq('id', r.id); dlg.close(); load(); toast('Deleted'); } };
  $('#f').onsubmit = async e => {
    e.preventDefault(); const sb = e.submitter; sb.disabled = true; sb.textContent = 'Saving…';
    const f = Object.fromEntries(new FormData(e.target)), nm = f.asset.trim(); let asset_id = null;
    if (nm) {
      let x = S.assets.find(a => a.name.toLowerCase() === nm.toLowerCase());
      if (!x) x = (await db.from('assets').insert({household_id:S.hh.id, name:nm}).select().single()).data;
      asset_id = x?.id;
    }
    const row = {household_id:S.hh.id, title:f.title, category:f.category, asset_id, provider:f.provider, reference:f.reference,
      due_date:f.due_date, cost:+f.cost || 0, cost_frequency:f.cost_frequency, notes:f.notes, is_private:!!f.is_private,
      owner_id:f.is_private ? S.user.id : (r.owner_id ?? null)};
    const {error} = await (r.id ? db.from('renewals').update(row).eq('id', r.id) : db.from('renewals').insert(row));
    if (error) { sb.disabled = false; sb.textContent = 'Save'; return toast(error.message); }
    dlg.close(); load(); toast('Saved');
  };
}

function history(r) {
  const rows = [...(S.hist[r.id] || []).map(x => ({d:x.period_end, c:+x.cost, p:x.provider})), {d:r.due_date, c:+r.cost, p:r.provider, cur:true}];
  const max = Math.max(...rows.map(x => x.c), 1), per = r.cost_frequency === 'monthly' ? 'a month' : 'a year';
  const delta = (c, p) => { const d = c - p, sg = d > 0 ? '+' : '−'; return d === 0 ? '<small class=chg>No change</small>' : `<small class="chg ${d > 0 ? 'up' : 'down'}">${sg}${gbp(Math.abs(d))} (${sg}${Math.round(Math.abs(d) / p * 100)}%)</small>`; };
  const first = rows[0], tot = rows.length > 1 && first.c > 0 ? `<p>${delta(+r.cost, first.c)} since ${fmt(first.d)}</p>` : '<p><small>Only one price so far. Each time you use Renewed, that year\'s price is saved here.</small></p>';
  const list = rows.map((x, i) => `<div class=hrow><div class=top><b>${x.cur ? 'Current, to ' : 'Year to '}${fmt(x.d)}</b><b>${gbp(x.c)} ${per}</b></div>
  <div class=top><small>${esc(x.p || 'Provider not recorded')}</small>${i && rows[i - 1].c > 0 ? delta(x.c, rows[i - 1].c) : ''}</div><div class=bar><i style="width:${x.c / max * 100}%"></i></div></div>`).reverse().join('');
  dlg.innerHTML = `<h2>Price history: ${esc(r.title)}</h2>${tot}${list}<div class=row style="margin-top:16px"><button class=ghost id=cx>Close</button></div>`;
  dlg.showModal(); $('#cx').onclick = () => dlg.close();
}

function renewed(r) {
  const nd = new Date(r.due_date); nd.setFullYear(nd.getFullYear() + 1);
  dlg.innerHTML = `<form id=f><h2>Renewed: ${esc(r.title)}</h2><small>Last cost ${gbp(r.cost)}</small>
  <label>New cost<input type=number step=0.01 name=cost required value="${r.cost}"></label>
  <label>Provider<input name=provider value="${esc(r.provider)}"></label>
  <label>Next due date<input type=date name=due_date required value="${nd.toISOString().slice(0, 10)}"></label>
  <div class=row><button>Save renewal</button><button type=button class=ghost id=cx>Cancel</button></div></form>`;
  dlg.showModal();
  $('#cx').onclick = () => dlg.close();
  $('#f').onsubmit = async e => {
    e.preventDefault(); const sb = e.submitter; sb.disabled = true; sb.textContent = 'Saving…';
    const f = Object.fromEntries(new FormData(e.target));
    await db.from('renewal_history').insert({household_id:S.hh.id, renewal_id:r.id, period_end:r.due_date, cost:r.cost, provider:r.provider});
    const {error} = await db.from('renewals').update({cost:+f.cost, provider:f.provider, due_date:f.due_date, status:'active'}).eq('id', r.id);
    if (error) { sb.disabled = false; sb.textContent = 'Save'; return toast(error.message); }
    dlg.close(); load(); toast('Renewed, next due ' + fmt(f.due_date));
  };
}
</script>
</body>
</html>
